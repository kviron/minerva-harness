[package]
name = "minerva-tool-subagent"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-plugin-sdk = { path = "../../crates/plugin-sdk" }
minerva-delegation = { path = "../../crates/delegation" }
mh-tool-runtime = { path = "../mh-tool-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
