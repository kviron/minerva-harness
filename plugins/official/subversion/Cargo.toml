[package]
name = "openidea-plugin-subversion"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
openidea-plugin = { path = "../../../sdk/rust/openidea-plugin" }
serde_json = "1"
roxmltree = "0.20"

[profile.release]
opt-level = "s"
lto = true
strip = true
